<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>MediaMTX Path Viewer</title>
    <link rel="icon" href="{{.BaseURL}}/static/pictures/icon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/bootstrap_5_3_3.min.css">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/custom.css">
    <script src="{{.BaseURL}}/static/js/htmx.min.js"></script>
    <script src="{{.BaseURL}}/static/js/hls.js"></script>
    <script src="{{.BaseURL}}/static/js/bootstrap.bundle.min.js"></script>
</head>
<body hx-trigger="load" hx-get="{{.BaseURL}}/connect-to-server/" hx-target="#server-paths">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{.BaseURL}}/">
                <img src="{{.BaseURL}}/static/pictures/icon.png" alt="Logo" width="24" height="24">
                MediaMTX Path Viewer
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary" id="stream-count">-</span>
                <div class="form-check form-switch mb-0" title="Auto-refresh stream list">
                    <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
                    <label class="form-check-label text-light small" for="autoRefreshToggle">Auto</label>
                </div>
                <button type="button" class="btn btn-outline-light btn-sm"
                        hx-get="{{.BaseURL}}/connect-to-server/"
                        hx-target="#server-paths">
                    Refresh
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-3">
        <div id="server-paths">
            <!-- Loading state (replaced by HTMX) -->
            <div class="loading-state">
                <div class="spinner-border text-secondary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Connecting to MediaMTX server...</p>
            </div>
        </div>
    </div>

    <!-- Stream Detail Modal -->
    <div class="modal fade" id="streamDetailModal" tabindex="-1" aria-labelledby="streamDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="streamDetailModalLabel">Stream Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="streamDetailContent">
                    <div class="loading-state">
                        <div class="spinner-border text-secondary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container-fluid">
            MediaMTX Path Viewer {{.Version}}
        </div>
    </footer>

    <script>
        // Show modal when HTMX loads stream detail content
        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'streamDetailContent') {
                var modal = new bootstrap.Modal(document.getElementById('streamDetailModal'));
                modal.show();
            }
        });

        // Clean up video players when modal is closed
        document.getElementById('streamDetailModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('streamDetailContent').innerHTML = '';
        });

        // Auto-refresh toggle
        document.getElementById('autoRefreshToggle').addEventListener('change', function() {
            document.body.setAttribute('data-auto-refresh', this.checked ? 'true' : 'false');
        });
    </script>

</body>
</html>
