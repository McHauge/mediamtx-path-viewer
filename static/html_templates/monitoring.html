<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Monitoring - MediaMTX Path Viewer</title>
    <link rel="icon" href="{{.BaseURL}}/static/pictures/icon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/bootstrap_5_3_3.min.css">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/custom.css">
    <script src="{{.BaseURL}}/static/js/htmx.min.js"></script>
    <script src="{{.BaseURL}}/static/js/bootstrap.bundle.min.js"></script>
</head>
<body hx-trigger="load" hx-get="{{.BaseURL}}/monitoring-list/" hx-target="#monitoring-content">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{.BaseURL}}/">
                <img src="{{.BaseURL}}/static/pictures/icon.png" alt="Logo" width="24" height="24">
                MediaMTX Path Viewer
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-outline-light btn-sm" href="{{.BaseURL}}/">Streams</a>
                <a class="btn btn-outline-light btn-sm" href="{{.BaseURL}}/recordings/">Recordings</a>
                <a class="btn btn-light btn-sm" href="{{.BaseURL}}/monitoring/">Monitoring</a>
                <span class="badge bg-secondary" id="monitoring-status">-</span>
                <div class="form-check form-switch mb-0" title="Auto-refresh monitoring data">
                    <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
                    <label class="form-check-label text-light small" for="autoRefreshToggle">Auto</label>
                </div>
                <button type="button" class="btn btn-outline-light btn-sm"
                        hx-get="{{.BaseURL}}/monitoring-list/"
                        hx-target="#monitoring-content">
                    Refresh
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-3">
        <div id="monitoring-content">
            <!-- Loading state (replaced by HTMX) -->
            <div class="loading-state">
                <div class="spinner-border text-secondary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading monitoring data...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container-fluid">
            MediaMTX Path Viewer {{.Version}}
        </div>
    </footer>

    <script>
        // Auto-refresh toggle
        document.getElementById('autoRefreshToggle').addEventListener('change', function() {
            document.body.setAttribute('data-auto-refresh', this.checked ? 'true' : 'false');
        });

        // Check auto-refresh state before HTMX polling fires
        document.body.addEventListener('htmx:trigger', function(event) {
            var autoRefresh = document.body.getAttribute('data-auto-refresh');
            if (autoRefresh === 'false' && event.detail.elt && event.detail.elt.hasAttribute('data-auto-poll')) {
                event.preventDefault();
            }
        });
    </script>

</body>
</html>
