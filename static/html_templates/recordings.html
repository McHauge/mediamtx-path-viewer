<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Recordings - MediaMTX Path Viewer</title>
    <link rel="icon" href="{{.BaseURL}}/static/pictures/icon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/bootstrap_5_3_3.min.css">
    <link rel="stylesheet" href="{{.BaseURL}}/static/css/custom.css">
    <script src="{{.BaseURL}}/static/js/htmx.min.js"></script>
    <script src="{{.BaseURL}}/static/js/bootstrap.bundle.min.js"></script>
</head>
<body hx-trigger="load" hx-get="{{.BaseURL}}/recordings-list/" hx-target="#recording-paths">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{.BaseURL}}/">
                <img src="{{.BaseURL}}/static/pictures/icon.png" alt="Logo" width="24" height="24">
                MediaMTX Path Viewer
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-outline-light btn-sm" href="{{.BaseURL}}/">Streams</a>
                <a class="btn btn-light btn-sm" href="{{.BaseURL}}/recordings/">Recordings</a>
                <span class="badge bg-secondary" id="recording-count">-</span>
                <button type="button" class="btn btn-outline-light btn-sm"
                        hx-get="{{.BaseURL}}/recordings-list/"
                        hx-target="#recording-paths">
                    Refresh
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-3">
        <div id="recording-paths">
            <!-- Loading state (replaced by HTMX) -->
            <div class="loading-state">
                <div class="spinner-border text-secondary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading recordings...</p>
            </div>
        </div>
    </div>

    <!-- Recording Detail Modal -->
    <div class="modal fade" id="recordingDetailModal" tabindex="-1" aria-labelledby="recordingDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="recordingDetailModalLabel">Recording Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="recordingDetailContent">
                    <div class="loading-state">
                        <div class="spinner-border text-secondary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container-fluid">
            MediaMTX Path Viewer {{.Version}}
        </div>
    </footer>

    <script>
        // Show modal when HTMX loads recording detail content
        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'recordingDetailContent') {
                var modal = new bootstrap.Modal(document.getElementById('recordingDetailModal'));
                modal.show();
            }
        });

        // Clean up video players when modal is closed
        document.getElementById('recordingDetailModal').addEventListener('hidden.bs.modal', function () {
            var content = document.getElementById('recordingDetailContent');
            var video = content.querySelector('video');
            if (video) {
                video.pause();
                video.src = '';
            }
            content.innerHTML = '';
        });
    </script>

</body>
</html>
